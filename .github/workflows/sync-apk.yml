name: Sync latest Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-apk.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-latest-apk
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest Ila Firdawsi Android release
        run: |
          python - <<'PY'
          import json, os, urllib.request

          api = "https://api.github.com/repos/hacker123as/Ila-Firadawsi-Code/releases?per_page=20"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "ila-firdawsi-apk-sync"
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              releases = json.load(response)

          release = next(
              (r for r in releases if not r.get("draft") and str(r.get("tag_name", "")).startswith("app-v")),
              None
          )
          if not release:
              raise SystemExit("No app-v* Android release was found.")

          asset = next(
              (a for a in release.get("assets", []) if a.get("name") == "ila-firdawsi.apk"),
              None
          )
          if not asset:
              raise SystemExit(f"{release['tag_name']} does not contain ila-firdawsi.apk")

          url = asset["browser_download_url"]
          out = "ila-firdawsi.apk"
          request = urllib.request.Request(url, headers={"User-Agent": "ila-firdawsi-apk-sync"})
          with urllib.request.urlopen(request, timeout=120) as src, open(out, "wb") as dst:
              while True:
                  chunk = src.read(1024 * 1024)
                  if not chunk:
                      break
                  dst.write(chunk)

          size = os.path.getsize(out)
          if size < 1024 * 1024:
              raise SystemExit(f"Downloaded APK is unexpectedly small: {size} bytes")
          with open(out, "rb") as fh:
              if fh.read(4) != b"PK\x03\x04":
                  raise SystemExit("Downloaded file is not an APK/ZIP.")

          tag = str(release["tag_name"])
          with open(".apk-version", "w", encoding="utf-8") as fh:
              fh.write(tag + "\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"APK_TAG={tag}\n")
              fh.write(f"APK_SIZE={size}\n")
          print(f"Downloaded {tag}: {size} bytes")
          PY

      - name: Commit the current APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ila-firdawsi.apk .apk-version

          if git diff --cached --quiet; then
            echo "The download repository already has $APK_TAG."
            exit 0
          fi

          git commit -m "Sync Ila Firdawsi Android $APK_TAG"
          git push
