name: Sync Android APK

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary artifact ZIP URL containing ila-firdawsi.apk
        required: true
        type: string
      tag:
        description: Version tag, for example app-v1.5.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-latest-apk
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        env:
          APK_ARTIFACT_URL: ${{ inputs.artifact_url }}
          APK_TAG: ${{ inputs.tag }}
        run: |
          curl -fL --retry 3 --retry-delay 2 "$APK_ARTIFACT_URL" -o /tmp/ila-firdawsi-apk.zip
          rm -rf /tmp/ila-apk && mkdir -p /tmp/ila-apk
          unzip -q /tmp/ila-firdawsi-apk.zip -d /tmp/ila-apk
          cp /tmp/ila-apk/ila-firdawsi.apk ./ila-firdawsi.apk

          size="$(stat -c%s ila-firdawsi.apk)"
          if [ "$size" -lt 1000000 ]; then
            echo "APK is unexpectedly small: $size bytes"
            exit 1
          fi

          magic="$(xxd -p -l 4 ila-firdawsi.apk)"
          if [ "$magic" != "504b0304" ]; then
            echo "Downloaded file is not an APK/ZIP"
            exit 1
          fi

          printf '%s\n' "$APK_TAG" > .apk-version

      - name: Commit the current APK
        env:
          APK_TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ila-firdawsi.apk .apk-version

          if git diff --cached --quiet; then
            echo "The download repo already has $APK_TAG."
            exit 0
          fi

          git commit -m "Sync Ila Firdawsi Android $APK_TAG"
          git push
