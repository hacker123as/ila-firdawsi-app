name: Sync Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest-apk
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android 1.7.0 build artifact
        env:
          APK_ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-c314-81f5-b0a7-0d343ae453e3/raw?se=2026-10-06T15%3A56%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=93552d21-d598-5c7f-827c-0619f6874c54&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T10%3A51%3A47Z&ske=2026-10-07T10%3A51%3A47Z&sks=b&skv=2026-02-06&sig=vb5nGa/W2nZ%2BO/5gSv/Y%2BgNAAsU88/DxXYWRyxW4X84%3D"
          APK_TAG: "app-v1.7.0"
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 "$APK_ARTIFACT_URL" -o /tmp/ila-firdawsi-apk.zip
          rm -rf /tmp/ila-apk && mkdir -p /tmp/ila-apk
          unzip -q /tmp/ila-firdawsi-apk.zip -d /tmp/ila-apk
          cp /tmp/ila-apk/ila-firdawsi.apk ./ila-firdawsi.apk

          size="$(stat -c%s ila-firdawsi.apk)"
          if [ "$size" -lt 1000000 ]; then
            echo "APK is unexpectedly small: $size bytes"
            exit 1
          fi

          magic="$(xxd -p -l 4 ila-firdawsi.apk)"
          if [ "$magic" != "504b0304" ]; then
            echo "Downloaded file is not an APK/ZIP."
            exit 1
          fi

          printf '%s\n' "$APK_TAG" > .apk-version
          echo "Verified $APK_TAG ($size bytes)."

      - name: Commit current APK to main
        env:
          APK_TAG: "app-v1.7.0"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ila-firdawsi.apk .apk-version

          if git diff --cached --quiet; then
            echo "main already has $APK_TAG."
            exit 0
          fi

          git commit -m "Sync Ila Firdawsi Android $APK_TAG"
          git push origin HEAD:main
